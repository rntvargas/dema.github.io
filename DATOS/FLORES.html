<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLORES PARA ANA MADELEY</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }
        #galaxyCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #click-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            color: #fce700;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; font-size: 2.5rem; cursor: pointer; text-align: center;
            text-shadow: 0 0 20px #fce700;
            transition: opacity 1s ease;
        }
        audio { display: none; }
    </style>
</head>
<body>
    <div id="click-overlay">Toca la pantalla para entrar al universo...</div>
    <audio id="bg-music" src="img/Floricienta.mp3" loop></audio>
    <canvas id="galaxyCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const overlay = document.getElementById('click-overlay');
        const audio = document.getElementById('bg-music');

        overlay.addEventListener('click', () => {
            audio.play();
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 1000);
        });

        // ================= Escena WebGL (Three.js) =================
        const canvas = document.getElementById('galaxyCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        let targetDist = 400, currentDist = 400;
        let rotX = 1.0, rotY = 0; // Inclinación inicial para ver la galaxia de lado

        // Resplandor central (Núcleo)
        function createCoreGlow() {
            const c = document.createElement('canvas');
            c.width = c.height = 512;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(256, 256, 10, 256, 256, 256);
            grad.addColorStop(0, 'rgba(255, 245, 150, 1)');
            grad.addColorStop(0.2, 'rgba(252, 231, 0, 0.8)');
            grad.addColorStop(0.5, 'rgba(200, 150, 0, 0.3)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);
            return new THREE.CanvasTexture(c);
        }
        
        const glowMaterial = new THREE.SpriteMaterial({ 
            map: createCoreGlow(), 
            transparent: true, 
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const coreGlow = new THREE.Sprite(glowMaterial);
        coreGlow.scale.set(400, 400, 1);
        scene.add(coreGlow);

        // Crear textura de flor amarilla matemáticamente para WebGL
        function createFlowerTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const ctx = c.getContext('2d');
            
            ctx.translate(64, 64);
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fce700';
            
            // Pétalos
            ctx.fillStyle = '#ffeb3b'; 
            ctx.strokeStyle = '#fbc02d'; 
            ctx.lineWidth = 2;
            
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-25, -25, -25, -50, 0, -50);
                ctx.bezierCurveTo(25, -50, 25, -25, 0, 0);
                ctx.fill();
                ctx.stroke();
                ctx.rotate((Math.PI * 2) / 5);
            }
            
            // Centro
            ctx.shadowBlur = 5;
            ctx.fillStyle = '#f57f17'; 
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            
            return new THREE.CanvasTexture(c);
        }
        const flowerTexture = createFlowerTexture();

        // 1. Polvo estelar (2500 puntos diminutos)
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(2500 * 3);
        for(let i = 0; i < 2500; i++){
            // Distribución espiral
            let dist = Math.pow(Math.random(), 1.5) * 600;
            let angle = (dist * 0.015) + (Math.floor(Math.random() * 2) * Math.PI);
            // Dispersión
            dist += (Math.random() - 0.5) * 100;
            angle += (Math.random() - 0.5) * 0.5;
            
            starPos[i*3+0] = dist * Math.cos(angle);
            starPos[i*3+1] = (Math.random() - 0.5) * (dist * 0.05 + 10); // Grosor
            starPos[i*3+2] = dist * Math.sin(angle);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ size: 2.0, color: 0xffffff, transparent: true, opacity: 0.6, depthWrite: false });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // 2. Flores amarillas espirales (500 flores)
        const flowerGroup = new THREE.Group();
        scene.add(flowerGroup);
        const flowerMat = new THREE.SpriteMaterial({ map: flowerTexture, transparent: true, depthWrite: false });
        
        for(let i = 0; i < 500; i++){
            const sprite = new THREE.Sprite(flowerMat);
            let dist = Math.pow(Math.random(), 1.2) * 550 + 20;
            let angle = (dist * 0.015) + (Math.floor(Math.random() * 2) * Math.PI);
            dist += (Math.random() - 0.5) * 60;
            angle += (Math.random() - 0.5) * 0.3;
            
            sprite.position.set(
                dist * Math.cos(angle),
                (Math.random() - 0.5) * (dist * 0.05),
                dist * Math.sin(angle)
            );
            
            let size = 5 + Math.random() * 10;
            sprite.scale.set(size, size, 1);
            
            // Velocidad orbital (Kepleriana)
            sprite.userData = { 
                dist: dist, 
                angle: angle, 
                speed: 0.0005 + (10 / (dist + 50)) * 0.01,
                yOffset: sprite.position.y
            };
            flowerGroup.add(sprite);
        }

        // 3. Deseos Flotantes (¡Muchísimos más!)
        const wishes = [
            "Dicen que las estrellas brillan más cuando alguien especial las mira ✨",
            "Tienes el don de pintar el mundo de colores para los más pequeños 🎨",
            "Me alegra que el universo nos haya cruzado 🌌",
            "Serás la mejor maestra, de esas que nunca se olvidan 🖍️",
            "Hay sonrisas que iluminan galaxias enteras 💛",
            "Es hermoso verte crecer mientras ayudas a crecer a otros 👧👦",
            "Ojalá todos tus días sean tan brillantes como hoy 🌻",
            "Tienes el corazón perfecto para guiar los primeros pasos del mundo 💛",
            "Algunas personas simplemente tienen magia 🌟",
            "Tu vocación es tan brillante y única como esta galaxia ✨",
            "Es lindo saber que estás ahí 🌙",
            "Las flores amarillas tienen un significado... por si no lo sabías 💛",
            "No cualquiera hace que el tiempo se detenga ✨",
            "Espero que hoy te saquen muchas sonrisas 🌻",
            "Ana Madeley... un nombre que suena a puras cosas buenas 💫",
            "Quien te conoce sabe la suerte que tiene 🌟",
            "A veces, las mejores cosas no se dicen, se demuestran 💛",
            "El mundo necesita más personas con tu luz 🌻",
            "Si las miradas hablaran, la mía te diría todo 💫",
            "Tu energía es contagiosa y hace todo mejor ✨",
            "Eres el tipo de persona que hace bonito un día gris 💛",
            "Tienes la capacidad de hacer sentir especial a cualquiera 🌟",
            "Hay miradas que son como un abrazo, la tuya es una de ellas 🌌",
            "Ser maestra es un súper poder, y a ti te queda perfecto 🦸‍♀️🖍️",
            "Incluso de lejos, iluminas como esta galaxia ✨",
            "Contigo las pláticas nunca son aburridas 🌻",
            "Siempre encuentras la forma de sacar una sonrisa 💛",
            "No dejes que nadie apague ese brillo tan tuyo 🌟",
            "Admiro mucho tu paciencia y dedicación 👧👦",
            "Un girasol para quien siempre mira hacia la luz 🌻",
            "El amarillo te sienta bien... pero tu sonrisa te queda mejor 💛",
            "Qué bonito coincidir en este espacio y tiempo 🌌",
            "Gracias por ser tan tú en un mundo tan raro ✨",
            "Ojalá te veas con los mismos ojos bonitos con los que yo te veo 💫",
            "Tu futuro salón de clases será el lugar más feliz 🖍️",
            "Es imposible no fijarse en alguien con tanta luz 🌟",
            "Te mereces todas las flores amarillas del universo 🌻",
            "Para Ana Madeley, la flor más especial de esta galaxia 🌌",
            "Con mucho cariño... de parte de Renato 💛"
        ];

        function createTextTexture(text) {
            const c = document.createElement('canvas');
            c.width = 1024; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle';
            
            // Sombra/Brillo
            ctx.shadowColor = '#fce700'; 
            ctx.shadowBlur = 15;
            
            let fontSize = 35; // Un poco más pequeño para acomodar textos largos
            ctx.font = `bold ${fontSize}px 'Poppins', sans-serif`;
            
            // Borde oscuro para que se lea en el espacio
            ctx.lineWidth = 5;
            ctx.strokeStyle = 'rgba(0,0,0,0.8)';
            ctx.strokeText(text, c.width/2, c.height/2);
            
            // Relleno amarillo
            ctx.fillStyle = '#ffeb3b';
            ctx.fillText(text, c.width/2, c.height/2);
            
            return new THREE.CanvasTexture(c);
        }

        const textGroup = new THREE.Group();
        scene.add(textGroup);

        wishes.forEach((text, i) => {
            const tex = createTextTexture(text);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
            const sp = new THREE.Sprite(mat);
            
            sp.scale.set(120, 15, 1);
            
            // Distribuirlos por una espiral mucho más amplia para que no colisionen
            let dist = 60 + (i * (600 / wishes.length));
            let angle = (dist * 0.015) + ((i % 2) * Math.PI) + (Math.random() * 0.5);
            
            // Variar la altura para dar un efecto de nube de mensajes 3D
            let heightOffset = (Math.random() - 0.5) * 60;
            if (i >= wishes.length - 2) {
                heightOffset = 30; // Los últimos mensajes (Ana, Renato) más arriba para resaltar
            }
            
            sp.position.set(dist * Math.cos(angle), heightOffset, dist * Math.sin(angle));
            sp.userData = { 
                dist: dist, 
                angle: angle, 
                speed: 0.0003 + (10 / (dist + 50)) * 0.01,
                yOffset: heightOffset
            };
            textGroup.add(sp);

            // Añadir una flor grande justo debajo del texto
            const bigFlower = new THREE.Sprite(flowerMat);
            bigFlower.scale.set(20, 20, 1);
            bigFlower.position.set(dist * Math.cos(angle), heightOffset - 15, dist * Math.sin(angle));
            bigFlower.userData = { dist: dist, angle: angle, speed: sp.userData.speed, yOffset: heightOffset - 15 };
            flowerGroup.add(bigFlower);
        });

        // Controles de Cámara interactivos (Click/Touch y arrastrar)
        let dragging = false, lastX = 0, lastY = 0;
        
        function onDown(e) { 
            dragging = true; 
            const t = e.touches ? e.touches[0] : e; 
            lastX = t.clientX; 
            lastY = t.clientY; 
        }
        function onMove(e) { 
            if (!dragging) return; 
            const t = e.touches ? e.touches[0] : e; 
            const dx = (t.clientX - lastX) / window.innerWidth; 
            const dy = (t.clientY - lastY) / window.innerHeight; 
            rotY -= dx * 5; 
            rotX = Math.max(-1.5, Math.min(1.5, rotX + dy * 3.5)); 
            lastX = t.clientX; 
            lastY = t.clientY; 
        }
        function onUp() { dragging = false; }
        
        window.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        
        window.addEventListener('touchstart', onDown, { passive: true });
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onUp, { passive: true });
        
        // Zoom (Rueda de mouse y pellizco)
        window.addEventListener('wheel', (e) => { 
            targetDist += e.deltaY * 0.25; 
            targetDist = Math.max(100, Math.min(800, targetDist)); 
        }, { passive: true });

        let pinch = 0;
        window.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const d = Math.hypot(dx, dy);
                if (pinch) {
                    targetDist += (pinch - d) * 1.5; 
                    targetDist = Math.max(100, Math.min(800, targetDist));
                }
                pinch = d;
            }
        }, { passive: false });
        window.addEventListener('touchend', () => { pinch = 0; }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Loop de Animación WebGL
        function animate() {
            requestAnimationFrame(animate);

            // Orbitar flores (tanto las chicas como las grandes debajo de los textos)
            flowerGroup.children.forEach(sp => {
                sp.userData.angle -= sp.userData.speed;
                sp.position.x = sp.userData.dist * Math.cos(sp.userData.angle);
                sp.position.z = sp.userData.dist * Math.sin(sp.userData.angle);
                if (sp.userData.yOffset !== undefined) {
                    sp.position.y = sp.userData.yOffset + Math.sin(sp.userData.angle * 10) * 5;
                }
            });
            
            // Orbitar textos
            textGroup.children.forEach(sp => {
                sp.userData.angle -= sp.userData.speed;
                sp.position.x = sp.userData.dist * Math.cos(sp.userData.angle);
                sp.position.z = sp.userData.dist * Math.sin(sp.userData.angle);
                
                // Hacer que el texto flote suavemente alrededor de su altura específica
                sp.position.y = sp.userData.yOffset + Math.sin(sp.userData.angle * 10) * 5;
            });
            
            // Orbitar estrellas (Polvo estelar rota entero para optimizar)
            stars.rotation.y -= 0.0005;

            // Suavizar Zoom y Cámara
            currentDist += (targetDist - currentDist) * 0.1;
            const cx = Math.cos(rotX), sx = Math.sin(rotX); 
            const cy = Math.cos(rotY), sy = Math.sin(rotY);
            
            camera.position.set(currentDist * sy * cx, currentDist * sx, currentDist * cy * cx);
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
