<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="DATOS/css/style.css">
    <link rel="icon" href="DATOS/img/flowers.png" type="image/x-icon">
    <title>FLORES PARA ANA MADELEY</title>
</head>
<body>
    <div class="greetings">
        <span>A</span>
        <span>N</span>
        <span>A</span>
    </div>
    <div class="description" style="text-align: center; font-size: 2rem;">
        <span>PARA ANA MADELEY</span><br>
        <span style="font-size: 1.5rem; color: #fff;">DE PARTE DE RENATO</span>
    </div>

    <!-- Countdown Timer -->
    <div id="countdown-container" class="description" style="color: #fff; font-size: 1.5rem; text-align: center;">
        <p style="margin-bottom: 5px;">Faltan:</p>
        <div id="timer" style="font-weight: bold; color: #fbff00; font-size: 2.5rem; text-shadow: 0 0 10px #fbff00;">Cargando...</div>
    </div>

    <div class="button" id="btn-flowers" style="display: none; margin-top: 20px;">
        <button>
            <a href="DATOS/FLORES.html">CLICK PLEASE</a>
        </button>
    </div>

    <script>
        // Configurar la fecha objetivo (21 de Septiembre del año actual)
        const currentYear = new Date().getFullYear();
        const targetDate = new Date(`September 21, ${currentYear} 00:00:00`).getTime();
        
        const timerEl = document.getElementById('timer');
        const countdownContainer = document.getElementById('countdown-container');
        const btnFlowers = document.getElementById('btn-flowers');

        function updateCountdown() {
            const currentTime = new Date();
            const difference = targetDate - currentTime;

            if (difference <= 0) {
                // Time reached!
                countdownContainer.style.display = 'none';
                btnFlowers.style.display = 'block';
            } else {
                const d = Math.floor(difference / (1000 * 60 * 60 * 24));
                const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((difference % (1000 * 60)) / 1000);

                timerEl.innerHTML = `${d}d ${h}h ${m}m ${s}s`;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
